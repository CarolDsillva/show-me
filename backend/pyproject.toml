[project]
name = "reprofix-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "jsonschema==4.26.0",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
